[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "framemill"
version = "0.1.6"
description = "Turn a rigged 3D model into a directional 2D sprite sheet, using Blender headless. No Blender knowledge required."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["sprite", "spritesheet", "blender", "gamedev", "pixel-art", "2d", "fbx", "gltf"]
authors = [{ name = "The framemill authors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Games/Entertainment",
]
dependencies = [
  # The desktop extra pulls in flet-desktop, the prebuilt client the GUI needs.
  # Without it, a plain install starts the CLI but the desktop window cannot open.
  "flet[desktop]>=0.86,<0.90",  # 0.86 API; older releases differ substantially
  "pillow>=10.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/ghreprimand/framemill"
Repository = "https://github.com/ghreprimand/framemill"
Issues = "https://github.com/ghreprimand/framemill/issues"

[project.scripts]
framemill = "framemill.cli:main"

[project.gui-scripts]
framemill-gui = "framemill.app:run"

[tool.hatch.build.targets.wheel]
packages = ["framemill"]

[tool.ruff]
line-length = 100
target-version = "py310"
