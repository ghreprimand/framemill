name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Linux build needs GTK / mpv / etc. for the Flutter desktop shell.
      - name: Linux build deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev mpv \
            libsecret-1-dev libunwind-dev

      - name: Install flet
        run: pip install "flet[cli]==0.86.5"

      - name: Build (${{ matrix.target }})
        run: flet build ${{ matrix.target }} -v --module-name main --artifact framemill --exclude .venv venv env .archon .git tests sample_models scratch tmp_render .pytest_cache .ruff_cache .env ".env.*" "*.log" "*.recipe.json" docs packaging

      # Wrap the Linux bundle into a portable AppImage.
      - name: Package AppImage
        if: matrix.target == 'linux'
        run: |
          if command -v appimagetool >/dev/null 2>&1; then
            bash packaging/build_appimage.sh
          else
            echo 'Trusted appimagetool not installed; uploading the Linux bundle.'
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: framemill-${{ matrix.target }}
          path: |
            build/
            dist/*.AppImage
          if-no-files-found: warn
